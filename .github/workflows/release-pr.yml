name: Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver release increment"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (validate without creating PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: npm run verify

      - name: Run tests and typecheck
        run: |
          npm run typecheck
          npm test

      - name: Calculate next version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          npm version ${{ inputs.bump }} --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Prepared bump from $CURRENT_VERSION to $NEXT_VERSION"

      - name: Check dry run status
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete. Target version: ${{ steps.version.outputs.next_version }}."
          git checkout package.json package-lock.json

      - name: Create Release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="release/v${{ steps.version.outputs.next_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git commit -am "chore(release): bump version to ${{ steps.version.outputs.next_version }}"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --title "chore(release): v${{ steps.version.outputs.next_version }}" \
            --body "Automated release preparation for v${{ steps.version.outputs.next_version }}. Review tests and changelog before merging." \
            --base main \
            --head "$BRANCH_NAME"
