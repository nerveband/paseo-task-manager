name: Release PR
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver release increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      notes:
        description: Reviewed user-visible release notes (Markdown)
        required: true
        type: string
      dry_run:
        description: Validate without creating a pull request
        required: true
        default: true
        type: boolean
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and verify
        run: |
          npm ci
          npm run check
          npm run verify
      - name: Prepare version and release notes
        id: version
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/prepare-release.mjs "$BUMP"
          echo "next=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          npm run verify
      - name: Create review pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          BRANCH="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md 
          git commit -m "chore(release): prepare v$VERSION"
          git push origin "$BRANCH"
          gh pr create --title "chore(release): v$VERSION" --body "Review the release notes, version changes, and checks before merging. This workflow does not publish or deploy." --head "$BRANCH"
